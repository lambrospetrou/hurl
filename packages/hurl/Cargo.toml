[package]
name = "hurl"
version = "8.1.0"
authors = ["Fabrice Reix <fabrice.reix@orange.com>", "Jean-Christophe Amiel <jeanchristophe.amiel@orange.com>", "Filipe Pinto <filipe.pinto@orange.com>"]
edition = "2024"
license = "Apache-2.0"
description = "Hurl, run and test HTTP requests"
documentation = "https://hurl.dev"
homepage = "https://hurl.dev"
repository = "https://github.com/Orange-OpenSource/hurl"
rust-version = "1.99.0"

[lib]
name = "hurl"

[[bin]]
name = "hurl"
path = "src/main.rs"
required-features = ["curl", "libxml"]

[features]
default = ["curl", "libxml"]
# Send HTTP requests with libcurl. Without this feature, HTTP requests, clock and sleep go through
# the host platform (see `hurl::host`), for targets like wasm32-unknown-unknown.
curl = ["dep:curl", "dep:curl-sys"]
# Use libxml2 for XML request bodies and XPath queries. Without this feature, XPath queries and
# filters fail with an unsupported error.
libxml = ["dep:libxml", "hurl_core/libxml"]
# Re-export of curl/static-ssl: use a bundled OpenSSL version and statically link to it. Only applies on platforms that
# use OpenSSL
static-openssl = ["curl", "curl/static-ssl", "curl-sys/static-ssl"]

[dependencies]
base64 = "0.23.1"
brotli = "9.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["string", "wrap_help"] }
curl = { version = "0.4.51", optional = true }
curl-sys = { version = "0.4.91", optional = true }
encoding_rs = "0.8.42"
glob = "0.3.4"
hurl_core = { version = "8.1.0", path = "../hurl_core", default-features = false }
libflate = "2.3.2"
libxml = { version = "0.3.22", optional = true }
md5 = "0.8.1"
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
url = "2.5.8"
xml = "1.4.0"
# uuid features: lets you generate random UUIDs and use a faster (but still sufficiently random) RNG
uuid = { version = "1.28.0", features = ["v4" , "fast-rng"] }
similar = "3.2.0"

# On wasm32-unknown-unknown, the embedder provides randomness with a getrandom custom backend.
[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { version = "1.28.0", features = ["v4", "rng-getrandom"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
terminal_size = "0.4.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[build-dependencies]
cc = "1.7.0"

[lints]
workspace = true
