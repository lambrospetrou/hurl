[package]
name = "hurl_core"
version = "8.1.0"
authors = ["Fabrice Reix <fabrice.reix@orange.com>", "Jean-Christophe Amiel <jeanchristophe.amiel@orange.com>", "Filipe Pinto <filipe.pinto@orange.com>"]
edition = "2024"
license = "Apache-2.0"
description = "Hurl Core"
documentation = "https://hurl.dev"
homepage = "https://hurl.dev"
repository = "https://github.com/Orange-OpenSource/hurl"

[features]
default = ["libxml"]
# Use libxml2 to find the end of a XML request body. Without this feature, a built-in scanner
# is used (for targets without libxml2, like wasm32-unknown-unknown).
libxml = ["dep:libxml"]

[dependencies]
colored = "3.1.1"
libxml = { version = "0.3.22", optional = true }
regex = "1.13.1"

[lints]
workspace = true
