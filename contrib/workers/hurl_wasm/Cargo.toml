[package]
name = "hurl_wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "Hurl runner for WebAssembly hosts like Cloudflare Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false }
getrandom = "0.4.3"
hurl = { path = "../../../packages/hurl", default-features = false, features = ["libxml"] }
hurl_core = { path = "../../../packages/hurl_core", default-features = false }
hurlfmt = { path = "../../../packages/hurlfmt", default-features = false, features = ["libxml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Not a member of the Hurl workspace: this crate only builds for wasm32-unknown-unknown.
[workspace]

[patch.crates-io]
libxml = { path = "../libxml2/work/crates/libxml" }
